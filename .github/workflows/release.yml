name: Release

# Собирает установочный .ocmod.zip и прикрепляет к GitHub Release при пуше тега vX.Y.Z.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .ocmod.zip
        id: build
        run: |
          VER=$(grep -oE '<version>[^<]+' install.xml | head -1 | sed 's/<version>//')
          OUT="onecatalog-opencart-${VER}.ocmod.zip"
          zip -rq "$OUT" install.xml upload -x '*.DS_Store'
          echo "asset=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      # Релиз по тегу (asset — установочный архив для «Расширения → Установка расширений»).
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.asset }}
          generate_release_notes: true

      # Ручной запуск (workflow_dispatch): архив как build-артефакт.
      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.asset }}
          path: ${{ steps.build.outputs.asset }}
